name: Foundry Tests

on:
  push:
    branches: [main, autonoma-integration]
  pull_request:
    paths:
      - 'contracts/**'

permissions:
  contents: read

jobs:
  test:
    name: Forge Test + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install forge-std (if missing)
        run: |
          if [ ! -d lib/forge-std ]; then
            forge install foundry-rs/forge-std --no-commit
          fi

      - name: Compile contracts
        run: forge build

      - name: Run tests
        run: forge test --summary

      - name: Coverage report
        run: forge coverage --report lcov
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-coverage
          path: contracts/lcov.info
          retention-days: 7

  # Slither static analysis (nightly only — too slow for every PR)
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither .
        continue-on-error: true
        id: slither

      - name: Check for high-severity findings
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither found issues — check the log above"
          echo "High-severity findings require manual review"
          exit 0  # Advisory for now — don't block CI

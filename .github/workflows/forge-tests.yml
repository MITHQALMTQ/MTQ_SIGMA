name: Foundry Tests

on:
  push:
    branches: [main, autonoma-integration]
  pull_request:
    paths:
      - 'contracts/**'

permissions:
  contents: read

jobs:
  test:
    name: Forge Test + Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4
        # No submodules: recursive — lib/forge-std was a broken submodule ref.
        # contracts/lib/forge-std is committed directly as regular files.

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify forge-std present
        run: |
          # contracts/lib/forge-std is committed directly as regular files.
          # If the root lib/forge-std gitlink causes issues, remove it.
          if [ -f .gitmodules ] && git submodule status 2>/dev/null | grep -q lib/forge-std; then
            echo "Removing broken lib/forge-std submodule ref"
            git rm --cached lib/forge-std 2>/dev/null || true
          fi
          if [ ! -d lib/forge-std/src ]; then
            echo "forge-std missing in contracts/lib/forge-std — checking"
            if [ -d lib/forge-std/src ]; then
              echo "forge-std present in contracts/lib/forge-std ($(ls lib/forge-std/src | wc -l) files)"
            else
              echo "Installing forge-std..."
              forge install foundry-rs/forge-std --no-commit 2>/dev/null || true
            fi
          else
            echo "forge-std present ($(ls lib/forge-std/src | wc -l) files)"
          fi

      - name: Compile contracts
        run: forge build

      - name: Run tests
        run: forge test --summary

      - name: Coverage report
        run: forge coverage --report lcov
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundry-coverage
          path: contracts/lcov.info
          retention-days: 7

  # Slither static analysis (nightly only — too slow for every PR)
  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: contracts

    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Run Slither
        run: slither .
        continue-on-error: true
        id: slither

      - name: Check for high-severity findings
        if: steps.slither.outcome == 'failure'
        run: |
          echo "Slither found issues — check the log above"
          echo "High-severity findings require manual review"
          exit 0  # Advisory for now — don't block CI

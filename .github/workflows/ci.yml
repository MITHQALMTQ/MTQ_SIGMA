name: CI

on:
  push:
    branches: [main, autonoma-integration]
  pull_request:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Type safety + lint + no-Neon guardrail
  # ─────────────────────────────────────────────────────────────
  typecheck-and-lint:
    name: Typecheck + Lint + No-Neon Guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/prod.db"

      - name: Typecheck
        run: bun run typecheck
        # Note: mobile/ has a pre-existing react-native types issue that's
        # unrelated to the web app. We exclude it from CI typecheck.
        env:
          TSC_NODE_FLAGS: ""

      - name: ESLint
        run: bun run lint
        continue-on-error: true # ESLint is advisory for now

      - name: No-Neon guardrail
        run: bun run check:no-neon

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit tests (Bun test runner)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/test.db"

      - name: Run canonical invariant tests
        run: bun run src/lib/mtq/__tests__/canonical-invariants.ts
        env:
          DATABASE_URL: "file:/tmp/test.db"
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""

  # ─────────────────────────────────────────────────────────────
  # Job 3: Honest Status verification (must return NOT PRODUCTION-AUTHORIZED)
  # ─────────────────────────────────────────────────────────────
  honest-status:
    name: Honest Status Verification
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/honest.db"

      - name: Verify Honest Status returns NOT PRODUCTION-AUTHORIZED
        run: |
          bun -e "
          import { isProductionAuthorized, getHonestStatus, getValidationGates } from './src/lib/mtq/honest-status';
          const auth = isProductionAuthorized();
          const status = getHonestStatus();
          const gates = getValidationGates();
          console.log('isProductionAuthorized:', auth);
          console.log('getHonestStatus:', status);
          console.log('validationGates all passed:', gates.every(g => g.passed));
          if (auth) { console.error('FAIL: isProductionAuthorized returned true on testnet'); process.exit(1); }
          if (status.includes('PRODUCTION-AUTHORIZED')) { console.error('FAIL: status says PRODUCTION-AUTHORIZED'); process.exit(1); }
          if (gates.some(g => g.passed)) { console.error('FAIL: some validation gates passed'); process.exit(1); }
          console.log('PASS: Honest Status correctly returns NOT PRODUCTION-AUTHORIZED');
          "

name: CI

on:
  push:
    # Task 34 (2026-10-26): autonoma-integration removed — the branch was
    # deleted from GitHub in Task 32; keeping it here was dead wiring.
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 0: Secret scan — FAIL-CLOSED gate (Task 12 §2.2).
  # Runs BEFORE all other jobs; every downstream job depends on it.
  # ─────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (fail-closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — required for future history-scanning steps

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Worktree secret scan (the gate)
        run: bun run scripts/security/secret-scan.ts

      - name: Regression — seeded SYNTHETIC secret must BLOCK the gate (redacted output)
        run: bun test scripts/security/secret-scan.test.ts

      - name: Release controls fail-closed verification
        run: bun test src/lib/mtq/__tests__/release-controls.test.ts src/lib/mtq/__tests__/address-book-validation.test.ts

  # ─────────────────────────────────────────────────────────────
  # Job 1: Type safety + lint + no-Neon guardrail
  # ─────────────────────────────────────────────────────────────
  typecheck-and-lint:
    name: Typecheck + Lint + No-Neon Guardrail
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/prod.db"

      - name: Typecheck
        run: bun run typecheck
        # Note: mobile/ has a pre-existing react-native types issue that's
        # unrelated to the web app. We exclude it from CI typecheck.
        env:
          TSC_NODE_FLAGS: ""

      - name: ESLint
        run: bun run lint
        continue-on-error: true # ESLint is advisory for now

      - name: No-Neon guardrail
        run: bun run check:no-neon

  # ─────────────────────────────────────────────────────────────
  # Job 2: Unit tests (Bun test runner)
  # ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/test.db"

      - name: Run unit test battery (bun test — 37 tests / 3 files)
        # 2026-10-24 fix: this job previously ran canonical-invariants.ts in
        # full — an 8-layer battery whose Layers 5–7 include the OOM-class
        # stochastic re-runs (S5/S6/S3) that the Task-16 audit DELIBERATELY
        # excluded from re-execution (they OOM-kill constrained runners and
        # locally exceed 300s in Layer 7 alone). CI runs the proven fast
        # battery; canonical-invariants.ts remains the manual deep battery:
        #   bun src/lib/mtq/__tests__/canonical-invariants.ts
        run: bun test
        env:
          DATABASE_URL: "file:/tmp/test.db"
          TURSO_DATABASE_URL: ""
          TURSO_AUTH_TOKEN: ""

  # ─────────────────────────────────────────────────────────────
  # Job 3: Honest Status verification (must return NOT PRODUCTION-AUTHORIZED)
  # ─────────────────────────────────────────────────────────────
  honest-status:
    name: Honest Status Verification
    runs-on: ubuntu-latest
    needs: typecheck-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:/tmp/honest.db"

      - name: Verify Honest Status returns NOT PRODUCTION-AUTHORIZED
        run: |
          bun -e "
          import { isProductionAuthorized, getHonestStatus, getValidationGates } from './src/lib/mtq/honest-status';
          const auth = isProductionAuthorized();
          const honest = getHonestStatus();
          const gates = getValidationGates();
          console.log('isProductionAuthorized:', auth);
          console.log('getHonestStatus:', honest.status);
          console.log('validationGates all passed:', gates.every(g => g.passed));
          if (auth) { console.error('FAIL: isProductionAuthorized returned true on testnet'); process.exit(1); }
          if (honest.status === 'PRODUCTION-AUTHORIZED') { console.error('FAIL: status says PRODUCTION-AUTHORIZED'); process.exit(1); }
          if (gates.some(g => g.passed)) { console.error('FAIL: some validation gates passed'); process.exit(1); }
          console.log('PASS: Honest Status correctly returns NOT PRODUCTION-AUTHORIZED');
          "

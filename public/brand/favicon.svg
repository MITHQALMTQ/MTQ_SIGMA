<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD535"/>
      <stop offset="0.5" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#c99700"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD535"/>
      <stop offset="1" stop-color="#9c6f1a"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0B90B"/>
      <stop offset="50%" stop-color="#00D68F"/>
      <stop offset="100%" stop-color="#7B61FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep space background -->
  <rect width="64" height="64" rx="14" fill="#06080F"/>
  
  <!-- Rotating aurora ring -->
  <g transform="translate(32 32)">
    <circle r="26" fill="none" stroke="url(#aurora)" stroke-width="0.5" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="22" fill="none" stroke="url(#aurora)" stroke-width="0.3" opacity="0.2">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Sigma formed as a faceted gold ingot with glow -->
  <g transform="translate(12 12)" filter="url(#glow)">
    <!-- top bar of sigma (ingot top facet) -->
    <polygon points="4,4 36,4 30,14 10,14" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- diagonal connecting facet -->
    <polygon points="22,16 30,14 20,20 14,20" fill="#d4a84a" stroke="url(#goldEdge)" stroke-width="0.6"/>
    <!-- bottom bar of sigma (ingot base facet) -->
    <polygon points="4,36 36,36 30,26 10,26" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- left vertical -->
    <polygon points="4,4 10,14 10,26 4,36" fill="#b8861f" stroke="url(#goldEdge)" stroke-width="0.5"/>
    <!-- right vertical -->
    <polygon points="36,4 30,14 30,26 36,36" fill="#b8861f" stroke="url(#goldEdge)" stroke-width="0.5"/>
  </g>
  
  <!-- Pulsing emerald accent line at base (solvency indicator) -->
  <line x1="20" y1="52" x2="44" y2="52" stroke="#00D68F" stroke-width="1" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x1" values="20;22;20" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="44;42;44" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>

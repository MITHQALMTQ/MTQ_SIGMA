<?xml version="1.0" encoding="UTF-8"?>
<!--
  MTQΣ — favicon.svg (platform-unified)
  Vector echo of the official brand mark (src/components/landing/BrandMark.tsx):
    - dark glass disc on a midnight field (#020D1F)
    - neon gradient ring (cyan #22D3EE → blue #3B82F6 → violet #A855F7)
    - sharp faceted M built from two overlapping gradient chevrons
      (cyan → blue → indigo → violet crystalline facets)
  32x32 viewBox stays crisp at 16/32/96px sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MTQΣ">
  <defs>
    <linearGradient id="fring" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="fdisc" cx="42%" cy="32%" r="78%">
      <stop offset="0" stop-color="#15335c"/>
      <stop offset="0.55" stop-color="#0a1e3f"/>
      <stop offset="1" stop-color="#04101f"/>
    </radialGradient>
    <linearGradient id="ff1" x1="5" y1="6" x2="19" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#48eefb"/>
      <stop offset="1" stop-color="#0fb0e8"/>
    </linearGradient>
    <linearGradient id="ff2" x1="12" y1="6" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ec4f9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ff3" x1="12" y1="6" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d6ef5"/>
      <stop offset="1" stop-color="#9257f8"/>
    </linearGradient>
    <linearGradient id="ff4" x1="19" y1="6" x2="27" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b465f8"/>
      <stop offset="1" stop-color="#8b34f0"/>
    </linearGradient>
  </defs>

  <!-- badge disc -->
  <circle cx="16" cy="16" r="14.3" fill="url(#fdisc)"/>
  <ellipse cx="13" cy="10.3" rx="8.7" ry="5.3" fill="rgba(148,197,255,0.10)"/>

  <!-- faceted M — two overlapping chevrons -->
  <g transform="translate(0 1.7)">
    <path d="M5 25 L12.3 6 L12.3 10 L5 26.7 Z" fill="url(#ff1)"/>
    <path d="M12.3 6 L19.7 25 L19.7 26.7 L12.3 10 Z" fill="url(#ff2)"/>
    <path d="M12.3 25 L19.7 6 L19.7 10 L12.3 26.7 Z" fill="url(#ff3)"/>
    <path d="M19.7 6 L27 25 L27 26.7 L19.7 10 Z" fill="url(#ff4)"/>
  </g>

  <!-- neon gradient ring -->
  <circle cx="16" cy="16" r="14.8" fill="none" stroke="url(#fring)" stroke-width="1.6"/>
  <circle cx="16" cy="16" r="13.3" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="0.6"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  MTQΣ — favicon.svg
  A vector echo of the official PAR1D.jpg luxury emblem:
    - Black obsidian field (#0D0D0D)
    - Vertical hexagonal shield frame (portrait orientation, matching PAR1D aspect ~0.67)
    - Gold metallic Σ (Sigma) letterform center
    - Gold glowing core dot (the "golden sphere" from the source mark)
    - Subtle platinum inner stroke for the heraldic-tech-noir feel
  32x32 viewBox keeps it crisp at 16/32/96px sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="MTQΣ">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD535"/>
      <stop offset="0.45" stop-color="#F0B90B"/>
      <stop offset="0.75" stop-color="#C99700"/>
      <stop offset="1" stop-color="#9C6F1A"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1EC"/>
      <stop offset="0.5" stop-color="#C9C4BA"/>
      <stop offset="1" stop-color="#8A8478"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="0.4" stop-color="#FCD535"/>
      <stop offset="1" stop-color="#B88638"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian field — matches PAR1D's #0D0D0D backdrop -->
  <rect width="32" height="32" rx="4" fill="#0D0D0D"/>

  <!-- Vertical hexagonal shield frame (portrait, ~0.67 aspect) -->
  <polygon
    points="16,2 27,8 27,24 16,30 5,24 5,8"
    fill="none"
    stroke="url(#gold)"
    stroke-width="1.1"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- Inner platinum hairline for the heraldic-tech-noir feel -->
  <polygon
    points="16,4 25,9 25,23 16,28 7,23 7,9"
    fill="none"
    stroke="url(#platinum)"
    stroke-width="0.4"
    stroke-linejoin="round"
    opacity="0.55"
  />

  <!-- Sigma (Σ) letterform — gold metallic, centered -->
  <text
    x="16"
    y="20.5"
    text-anchor="middle"
    font-family="'Cormorant Garamond','Playfair Display',Georgia,serif"
    font-size="14"
    font-weight="700"
    fill="url(#gold)"
    filter="url(#glow)"
  >Σ</text>

  <!-- Glowing golden sphere at the geometric center -->
  <circle cx="16" cy="16" r="1.1" fill="url(#sphere)" filter="url(#coreGlow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MTQΣ brand favicon — Σ-gold-ingot mark (original design + animation) -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4d58d"/>
      <stop offset="0.5" stop-color="#e8b964"/>
      <stop offset="1" stop-color="#b8861f"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e6b0"/>
      <stop offset="1" stop-color="#9c6f1a"/>
    </linearGradient>
    <filter id="favicon-glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep space background with subtle pulse -->
  <rect width="64" height="64" rx="14" fill="#06080F">
    <animate attributeName="opacity" values="1;0.97;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Rotating subtle glow ring behind the ingot -->
  <g transform="translate(32 32)" opacity="0.15">
    <circle r="24" fill="none" stroke="url(#gold)" stroke-width="0.5" filter="url(#favicon-glow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Sigma formed as a faceted gold ingot (ORIGINAL DESIGN preserved) -->
  <g transform="translate(12 12)" filter="url(#favicon-glow)">
    <!-- top bar of sigma (ingot top facet) -->
    <polygon points="4,4 36,4 30,14 10,14" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.88;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- diagonal connecting facet -->
    <polygon points="22,16 30,14 20,20 14,20" fill="#d4a84a" stroke="url(#goldEdge)" stroke-width="0.6"/>
    <polygon points="22,16 14,20 10,14" fill="#c99a3a" opacity="0.9"/>
    <!-- bottom bar of sigma (ingot base facet) -->
    <polygon points="4,36 36,36 30,26 10,26" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="0.8">
      <animate attributeName="opacity" values="1;0.88;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="22,24 30,26 20,20 14,20" fill="#d4a84a" stroke="url(#goldEdge)" stroke-width="0.6"/>
    <polygon points="22,24 14,20 10,26 18,26" fill="#b8861f" opacity="0.95"/>
    <!-- emerald accent line — pulsing solvency indicator -->
    <rect x="14" y="38" width="12" height="1.6" rx="0.8" fill="#00D68F">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="12;14;12" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

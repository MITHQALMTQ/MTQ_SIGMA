<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MTQΣ brand favicon — hexagonal frame + stylized Z/Sigma with gold gradient + globe wireframe -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD535"/>
      <stop offset="0.4" stop-color="#F0B90B"/>
      <stop offset="0.7" stop-color="#c99700"/>
      <stop offset="1" stop-color="#9c6f1a"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD535"/>
      <stop offset="1" stop-color="#9c6f1a"/>
    </linearGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Deep space background -->
  <rect width="64" height="64" rx="14" fill="#06080F">
    <animate attributeName="opacity" values="1;0.97;1" dur="4s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Hexagonal frame -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3" filter="url(#favGlow)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </polygon>
  
  <!-- Globe wireframe (behind the Z) -->
  <g transform="translate(32 32)" opacity="0.08">
    <circle r="18" fill="none" stroke="#F0B90B" stroke-width="0.4"/>
    <ellipse rx="18" ry="8" fill="none" stroke="#F0B90B" stroke-width="0.3"/>
    <ellipse rx="8" ry="18" fill="none" stroke="#F0B90B" stroke-width="0.3"/>
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#F0B90B" stroke-width="0.2"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#F0B90B" stroke-width="0.2"/>
  </g>
  
  <!-- Stylized Z/Sigma (combining Z shape with sigma styling) -->
  <g transform="translate(32 32)" filter="url(#favGlow)">
    <!-- Top bar of Z -->
    <polygon points="-14,-12 14,-12 12,-6 -12,-6" fill="url(#goldGrad)" stroke="url(#goldEdge)" stroke-width="0.5">
      <animate attributeName="opacity" values="1;0.88;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- Diagonal connecting -->
    <polygon points="12,-6 14,-12 14,12 12,6" fill="#c99700" stroke="url(#goldEdge)" stroke-width="0.4"/>
    <polygon points="12,6 14,12 -14,12 -12,6" fill="url(#goldGrad)" stroke="url(#goldEdge)" stroke-width="0.5">
      <animate attributeName="opacity" values="1;0.88;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
    <!-- Left vertical accents -->
    <polygon points="-14,-12 -12,-6 -12,6 -14,12" fill="#9c6f1a" stroke="url(#goldEdge)" stroke-width="0.3"/>
    
    <!-- Central glowing circle (emblem at intersection) -->
    <circle r="3" fill="url(#goldGrad)" stroke="#FCD535" stroke-width="0.5">
      <animate attributeName="r" values="2.8;3.2;2.8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Pulsing emerald solvency line at base -->
  <line x1="22" y1="54" x2="42" y2="54" stroke="#00D68F" stroke-width="1" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x1" values="22;24;22" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="42;40;42" dur="2s" repeatCount="indefinite"/>
  </line>
</svg>

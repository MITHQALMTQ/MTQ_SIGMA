# ============================================================================
#  MTQΣ V3 — Foundry configuration
#  ----------------------------------------------------------------------------
#  The protocol owner MUST install Foundry before this config takes effect:
#
#     curl -L https://foundry.paradigm.xyz | sh
#     foundryup
#     cd /path/to/repo/contracts
#     forge install foundry-rs/forge-std --no-commit
#     forge install OpenZeppelin/openzeppelin-contracts --no-commit
#     forge test -vvv
#
#  This sandbox does NOT have Foundry installed (no `forge` binary), so the
#  test file `contracts/MTQSigmaV2.t.sol` cannot be compiled here. The test
#  file is delivered as source-ready and is intended to be run by the protocol
#  owner in their own Foundry-equipped environment.
# ============================================================================

[profile.default]
src = "."
out = "foundry-out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings: forge-std is the standard Foundry test library; OpenZeppelin
# is referenced (as @openzeppelin) for optional ERC-20 helpers and for
# consistency with the contract's inline subset of OZ patterns.
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# SKIP (2026-10-24):
#  - MtqEcosystem.sol — the ONLY file importing @openzeppelin, which is NOT
#    vendored (the .gitignore keeps lib/openzeppelin-contracts/ out; the
#    foundry.toml.example header lists `forge install OpenZeppelin/...` as an
#    owner-side prerequisite). Excluded so the suite compiles hermetically;
#    to compile it, vendor OZ (same pattern as the vendored forge-std).
#  - MTQSigmaV3.sol — a KNOWN non-deployable draft per audit C-044 (runtime
#    40,500 B > 24,576 B EIP-170 limit), and its source has GENUINE compile
#    errors (Error 7364 destructuring arity, 9574 bytes32→MintRequest struct
#    conversion, 9582 missing member DailyRedeemCapReset — surfaced by the
#    2026-10-24 CI runs e01ce89). Excluded from the build until the owner
#    commissions the v3 contract remediation (R-06); the J2 suite scope is
#    the 30-test MTQSigmaV2 suite, which is self-contained.
skip = ["MtqEcosystem.sol", "MTQSigmaV3.sol"]

# Test configuration: longer timeout for the S5 stochastic fuzz tests
# (they run 100 trajectories × 30 ticks each per seed).
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.ci]
fuzz = { runs = 1024 }

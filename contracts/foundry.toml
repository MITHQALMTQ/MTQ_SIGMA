# ============================================================================
#  MTQΣ V3 — Foundry configuration
#  ----------------------------------------------------------------------------
#  The protocol owner MUST install Foundry before this config takes effect:
#
#     curl -L https://foundry.paradigm.xyz | sh
#     foundryup
#     cd /path/to/repo/contracts
#     forge install foundry-rs/forge-std --no-commit
#     forge install OpenZeppelin/openzeppelin-contracts --no-commit
#     forge test -vvv
#
#  This sandbox does NOT have Foundry installed (no `forge` binary), so the
#  test file `contracts/MTQSigmaV2.t.sol` cannot be compiled here. The test
#  file is delivered as source-ready and is intended to be run by the protocol
#  owner in their own Foundry-equipped environment.
# ============================================================================

[profile.default]
src = "."
out = "foundry-out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Remappings: forge-std is the standard Foundry test library; OpenZeppelin
# is referenced (as @openzeppelin) for optional ERC-20 helpers and for
# consistency with the contract's inline subset of OZ patterns.
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

# SKIP (2026-10-24) — the non-deployable v3 DRAFT cluster + the OZ-dependent
# ecosystem contract are excluded so the Deliverable-J2 suite (the
# self-contained MTQSigmaV2 30-test suite) compiles hermetically:
#  - MTQSigmaV3.sol — known non-deployable draft per audit C-044 (runtime
#    40,500 B > 24,576 B EIP-170 limit) with GENUINE source errors (Error
#    7364 destructuring arity, 9574 bytes32→MintRequest conversion, 9582
#    missing member DailyRedeemCapReset — CI runs e01ce89/32a7f39).
#  - test/MTQSigmaV3.t.sol + adapters/{Chainlink,Chronicle,Pyth}Adapter.sol
#    — import FROM MTQSigmaV3.sol (the adapters pull in IOracleAdapter from
#    the draft), re-adding it to the build graph despite the skip above.
#  - MtqEcosystem.sol — the only file importing @openzeppelin (not vendored;
#    owner-side prerequisite per the foundry.toml.example header).
# The whole v3-draft cluster returns to the build when the owner commissions
# the v3 contract remediation (R-06) — remove these skips then. Contract
# sources are deliberately NOT edited here.
skip = [
    "MtqEcosystem.sol",
    "MTQSigmaV3.sol",
    "test/MTQSigmaV3.t.sol",
    "adapters/ChainlinkAdapter.sol",
    "adapters/ChronicleAdapter.sol",
    "adapters/PythAdapter.sol",
]

# Test configuration: longer timeout for the S5 stochastic fuzz tests
# (they run 100 trajectories × 30 ticks each per seed).
[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.ci]
fuzz = { runs = 1024 }
